name: PokerCoach
options:
  bundleIdPrefix: com.porkhelper
configs:
  Debug: debug
  Dogfood: release
  Release: release
packages:
  PokerCore:
    path: Packages/PokerCore
  StrategyContent:
    path: Packages/StrategyContent
  TrainingDomain:
    path: Packages/TrainingDomain
  TrainingPersistence:
    path: Packages/TrainingPersistence
  SessionSimulation:
    path: Packages/SessionSimulation
  SessionPersistence:
    path: Packages/SessionPersistence
targets:
  PokerCoach:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PokerCoach
        excludes:
          - Resources
      - path: PokerCoach/Resources
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Dogfood: Config/Dogfood.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: PokerCore
      - package: StrategyContent
      - package: TrainingDomain
      - package: TrainingPersistence
      - package: SessionSimulation
      - package: SessionPersistence
    info:
      path: PokerCoach/Info.plist
      properties:
        CFBundleDisplayName: 手牌教练
        # Which content this build is allowed to carry. Stamped into the
        # product so the release gate reads it from the artifact rather than
        # trusting a flag its caller has to remember to pass.
        PCContentChannel: $(PC_CONTENT_CHANNEL)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          # Permits http only to loopback and .local addresses, which is what a
          # locally hosted development service and the end-to-end harness need.
          # Arbitrary loads stay disabled; the release gate asserts that.
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  PokerCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources: [PokerCoachTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PokerCoach
  PokerCoachUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [PokerCoachUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PokerCoach
schemes:
  PokerCoach:
    build:
      targets:
        PokerCoach: all
    test:
      targets:
        - PokerCoachTests
        - PokerCoachUITests
